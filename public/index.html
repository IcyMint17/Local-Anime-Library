<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本地番剧媒体库</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%93%BA%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">番</span>
          <div>
            <div class="brand-title">本地番剧媒体库</div>
            <div class="brand-sub" id="brandSub">正在载入…</div>
          </div>
        </div>
        <div class="search-wrap">
          <input id="search" class="search" type="search" placeholder="搜索番剧名 / 文件夹名…" autocomplete="off" />
        </div>
        <div class="topbar-actions">
          <button id="btnScan" class="btn btn-primary">扫描</button>
          <button id="btnSettings" class="btn btn-ghost">设置</button>
        </div>
      </header>

      <div class="layout">
        <nav class="sidebar">
          <button class="nav-item is-active" data-filter="all">全部<span class="nav-count" id="countAll">0</span></button>
          <button class="nav-item" data-filter="unmatched">未识别<span class="nav-count" id="countUnmatched">0</span></button>
          <button class="nav-item" data-filter="none">未看<span class="nav-count" id="countNone">0</span></button>
          <button class="nav-item" data-filter="watching">观看中<span class="nav-count" id="countWatching">0</span></button>
          <button class="nav-item" data-filter="completed">已看完<span class="nav-count" id="countCompleted">0</span></button>
          <div class="sidebar-foot">
            <div class="scan-status" id="scanStatus"></div>
          </div>
        </nav>

        <main class="content">
          <div class="toolbar">
            <div class="toolbar-info" id="toolbarInfo">—</div>
            <label class="select-wrap">
              排序
              <select id="sort">
                <option value="recent">最近扫描</option>
                <option value="rating">评分</option>
                <option value="title">名称</option>
                <option value="progress">观看进度</option>
                <option value="files">文件数</option>
              </select>
            </label>
          </div>
          <div id="grid" class="grid"></div>
          <div id="emptyState" class="empty" hidden></div>
        </main>
      </div>
    </div>

    <div id="overlay" class="overlay" hidden>
      <div id="overlayPanel" class="overlay-panel"></div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
