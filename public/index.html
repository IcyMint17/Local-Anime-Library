<!DOCTYPE html>
<html lang="zh-CN" data-mode="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本地番剧媒体库</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="/icon.jpg" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <span class="ambient-orb ambient-orb--a"></span>
      <span class="ambient-orb ambient-orb--b"></span>
      <span class="ambient-orb ambient-orb--c"></span>
    </div>

    <div id="app" class="shell">
      <header class="topbar">
        <a class="brand" href="#/home" data-nav="home" aria-label="回到首页">
          <span class="brand-mark"><img src="/icon.jpg" alt="" /></span>
          <span class="brand-text">
            <strong>本地番剧媒体库</strong>
            <span>Anime Media Center</span>
          </span>
        </a>

        <label class="search-box" for="search">
          <span class="search-icon" data-icon="search"></span>
          <input id="search" class="search" type="search" placeholder="搜索番剧 / 文件夹…" autocomplete="off" spellcheck="false" />
          <kbd class="search-kbd">/</kbd>
        </label>

        <div class="topbar-actions">
          <button class="icon-btn" id="btnMode" type="button" title="切换深色 / 亮色" aria-label="切换深色 / 亮色"></button>
          <button class="icon-btn" id="btnGotoSettings" type="button" data-nav="settings" title="设置" aria-label="设置"></button>
          <button class="icon-btn desktop-only" id="btnAppMenu" type="button" title="菜单" aria-label="菜单"></button>
          <div class="window-controls desktop-only" id="windowControls">
            <button class="window-btn" id="winMin" type="button" title="最小化" aria-label="最小化"></button>
            <button class="window-btn" id="winMax" type="button" title="最大化" aria-label="最大化"></button>
            <button class="window-btn is-close" id="winClose" type="button" title="关闭" aria-label="关闭"></button>
          </div>
        </div>
      </header>

      <main class="pages" id="pages">
        <section class="page" id="page-home" data-page="home" aria-label="主页"></section>
        <section class="page" id="page-timeline" data-page="timeline" aria-label="时间线" hidden></section>
        <section class="page" id="page-library" data-page="library" aria-label="媒体库" hidden></section>
        <section class="page" id="page-favorites" data-page="favorites" aria-label="收藏" hidden></section>
        <section class="page" id="page-settings" data-page="settings" aria-label="设置" hidden></section>
      </main>

      <nav class="dock" id="dock" aria-label="主导航"></nav>
    </div>

    <div id="overlay" class="overlay" hidden>
      <div id="overlayPanel" class="overlay-panel" role="dialog" aria-modal="true"></div>
    </div>

    <div id="fileOverlay" class="overlay overlay--stacked" hidden>
      <div id="filePanel" class="overlay-panel dialog-panel file-panel" role="dialog" aria-modal="true" aria-label="文件信息"></div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
