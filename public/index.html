<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本地番剧媒体库</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="/icon.jpg" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <img class="brand-icon" src="/icon.jpg" alt="" />
          <span class="brand-title">本地番剧媒体库</span>
        </div>
        <div class="search-wrap">
          <input id="search" class="search" type="search" placeholder="搜索番剧名 / 文件夹名…" autocomplete="off" />
        </div>
        <div class="topbar-actions">
          <button class="icon-btn desktop-only" id="btnAppMenu" title="菜单"></button>
          <button class="icon-btn mode-toggle" id="btnMode" title="切换深色 / 亮色"></button>
          <div class="window-controls desktop-only" id="windowControls">
            <button class="window-btn" id="winMin" title="最小化" aria-label="最小化"></button>
            <button class="window-btn" id="winMax" title="最大化" aria-label="最大化"></button>
            <button class="window-btn is-close" id="winClose" title="关闭" aria-label="关闭"></button>
          </div>
        </div>
      </header>

      <div class="layout" id="layout">
        <nav class="sidebar" id="sidebar">
          <div class="sidebar-head">
            <span class="sidebar-label">媒体库</span>
            <button class="icon-btn sidebar-toggle" id="btnCollapse" title="收起 / 展开侧边栏">
              <span class="toggle-glyph">«</span>
            </button>
          </div>
          <div class="nav-list" id="navList"></div>

          <div class="sidebar-foot">
            <button class="side-action is-primary" id="btnScan" title="扫描媒体库">
              <span class="side-icon" data-icon="scan"></span>
              <span class="side-text">扫描</span>
            </button>
            <button class="side-action" id="btnSettings" title="设置">
              <span class="side-icon" data-icon="settings"></span>
              <span class="side-text">设置</span>
            </button>
            <div class="scan-status" id="scanStatus"></div>
            <div class="sidebar-stats" id="sidebarStats">正在载入…</div>
          </div>
        </nav>

        <main class="content">
          <section class="continue" id="continueSection" hidden>
            <div class="continue-head">
              <span class="continue-title">继续观看</span>
              <span class="continue-sub" id="continueSub"></span>
            </div>
            <div class="continue-row" id="continueRow"></div>
          </section>

          <div class="toolbar">
            <div class="toolbar-info" id="toolbarInfo">—</div>
            <label class="select-wrap">
              排序
              <select id="sort">
                <option value="recent">最近扫描</option>
                <option value="rating">评分</option>
                <option value="title">名称</option>
                <option value="progress">观看进度</option>
                <option value="files">文件数</option>
              </select>
            </label>
          </div>
          <div id="grid" class="grid"></div>
          <div id="emptyState" class="empty" hidden></div>
        </main>
      </div>
    </div>

    <div id="overlay" class="overlay" hidden>
      <div id="overlayPanel" class="overlay-panel"></div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
